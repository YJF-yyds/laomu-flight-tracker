<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鑰佹瘝璧烽瑙傛祴鍙?/title>
  <style>
    :root {
      color: #142131;
      font-family: Arial, "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
    }

    button {
      font: inherit;
    }

    .sky-stage {
      background:
        radial-gradient(circle at 14% 43%, rgba(255, 255, 255, 0.78) 0 3.8rem, transparent 4rem),
        radial-gradient(circle at 20% 47%, rgba(255, 255, 255, 0.58) 0 5.2rem, transparent 5.4rem),
        linear-gradient(180deg, #2878bf 0%, #6eb2e5 48%, #bbdbed 68%, #8eb37f 70%, #8c987d 73%, #b9b4a5 74%, #d2d1ca 100%);
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .topbar {
      align-items: flex-start;
      color: #fff;
      display: flex;
      gap: 1.5rem;
      justify-content: space-between;
      left: 0;
      padding: clamp(1.1rem, 2.4vw, 2rem);
      position: absolute;
      right: 0;
      text-shadow: 0 0.16rem 0.55rem rgba(28, 60, 90, 0.32);
      top: 0;
      z-index: 8;
    }

    .eyebrow {
      font-size: clamp(0.78rem, 1.5vw, 0.92rem);
      font-weight: 700;
      margin: 0 0 0.35rem;
      opacity: 0.9;
    }

    h1 {
      font-size: clamp(1.9rem, 5vw, 4.7rem);
      line-height: 0.96;
      margin: 0;
    }

    .summary-strip {
      align-items: center;
      backdrop-filter: blur(10px);
      background: rgba(16, 62, 98, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem 1rem;
      justify-content: flex-end;
      padding: 0.75rem 0.9rem;
    }

    .summary-strip span {
      color: rgba(255, 255, 255, 0.86);
      font-size: clamp(0.82rem, 1.7vw, 1rem);
      white-space: nowrap;
    }

    .summary-strip strong {
      color: #fff;
      font-size: 1.34em;
    }

    .flight-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      height: 100vh;
      isolation: isolate;
      padding: clamp(6.7rem, 16vh, 9.5rem) clamp(0.5rem, 3vw, 3rem) clamp(7.2rem, 15vh, 9rem);
      position: relative;
      z-index: 4;
    }

    .flight-lane {
      display: grid;
      grid-template-rows: 1fr auto;
      min-width: 0;
      position: relative;
    }

    .height-field {
      min-height: 0;
      position: relative;
    }

    .mother-wrap {
      --lift: calc(var(--meters) * clamp(2rem, 5.2vh, 3.55rem));
      bottom: clamp(1.9rem, 6vh, 4rem);
      left: 50%;
      position: absolute;
      transform: translate(-50%, calc(var(--lift) * -1));
      transition: transform 520ms cubic-bezier(0.22, 1.2, 0.35, 1);
      width: clamp(6rem, 15vw, 15rem);
      z-index: 4;
    }

    .mother {
      animation: hoverFloat 2.8s ease-in-out infinite;
      display: block;
      filter: drop-shadow(0 0.9rem 0.75rem rgba(28, 43, 58, 0.26));
      width: 100%;
    }

    .shadow {
      background: rgba(22, 28, 31, 0.25);
      border-radius: 999px;
      bottom: -0.3rem;
      filter: blur(4px);
      height: 0.72rem;
      left: 50%;
      opacity: calc(0.42 - var(--meters) * 0.025);
      position: absolute;
      transform: translateX(-50%);
      width: 42%;
    }

    .wake {
      background: rgba(255, 255, 255, 0.5);
      border-radius: 999px;
      filter: blur(2px);
      height: 0.22rem;
      opacity: 0;
      position: absolute;
      top: 70%;
      width: 23%;
    }

    .wake-left {
      animation: airWake 1.6s ease-in-out infinite;
      left: 16%;
      transform: rotate(18deg);
    }

    .wake-right {
      animation: airWake 1.6s 0.35s ease-in-out infinite;
      right: 16%;
      transform: rotate(-18deg);
    }

    .boost {
      animation: popMeter 760ms ease-out both;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 8px;
      color: #1c5d8f;
      font-weight: 900;
      left: 52%;
      padding: 0.25rem 0.45rem;
      position: absolute;
      top: 34%;
      white-space: nowrap;
    }

    .meter {
      --meter-height: calc(var(--meters) * clamp(2rem, 5.2vh, 3.55rem));
      align-items: center;
      bottom: clamp(1.8rem, 5.8vh, 3.9rem);
      display: flex;
      gap: clamp(0.3rem, 1vw, 0.75rem);
      justify-content: center;
      left: 57%;
      min-width: clamp(4rem, 9vw, 7rem);
      position: absolute;
      transform: translateX(16%);
      z-index: 3;
    }

    .meter-line {
      background: #fff;
      display: block;
      height: max(2.2rem, var(--meter-height));
      position: relative;
      transition: height 520ms cubic-bezier(0.22, 1, 0.36, 1);
      width: 0.14rem;
    }

    .meter-line::before,
    .meter-line::after {
      background: #fff;
      content: "";
      height: 0.14rem;
      left: 50%;
      position: absolute;
      transform: translateX(-50%);
      width: 1.65rem;
    }

    .meter-line::before {
      top: 0;
    }

    .meter-line::after {
      bottom: 0;
    }

    .meter-label {
      color: #fff;
      font-size: clamp(1.25rem, 3.2vw, 3rem);
      font-weight: 900;
      text-shadow: 0 0.18rem 0.35rem rgba(22, 48, 71, 0.32);
      white-space: nowrap;
    }

    .lane-controls {
      align-items: center;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.66);
      border-radius: 8px;
      box-shadow: 0 1rem 2rem rgba(34, 61, 77, 0.18);
      display: flex;
      gap: 0.8rem;
      justify-content: space-between;
      margin: 0 clamp(0.2rem, 1.2vw, 1rem);
      padding: clamp(0.65rem, 1.5vw, 0.9rem);
      position: relative;
      z-index: 6;
    }

    .pilot-name,
    .pilot-height {
      margin: 0;
    }

    .pilot-name {
      color: #142131;
      font-size: clamp(1.3rem, 3.3vw, 2.1rem);
      font-weight: 900;
      line-height: 1;
    }

    .pilot-height {
      color: #4f6576;
      font-size: clamp(0.8rem, 1.7vw, 1rem);
      margin-top: 0.2rem;
      white-space: nowrap;
    }

    .lift-button,
    .reset-button {
      border: 0;
      cursor: pointer;
      font-weight: 900;
      transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    .lift-button {
      background: #fff2a8;
      border-radius: 8px;
      box-shadow: 0 0.38rem 0 #c98a25, 0 0.8rem 1.1rem rgba(82, 54, 22, 0.18);
      color: #6a3908;
      min-height: 2.65rem;
      min-width: clamp(4.1rem, 8vw, 5.5rem);
      padding: 0 0.85rem;
      white-space: nowrap;
    }

    .lift-button:hover {
      background: #ffe674;
      transform: translateY(-0.08rem);
    }

    .lift-button:active {
      box-shadow: 0 0.18rem 0 #c98a25, 0 0.35rem 0.7rem rgba(82, 54, 22, 0.16);
      transform: translateY(0.14rem);
    }

    .reset-button {
      background: rgba(18, 42, 58, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.38);
      border-radius: 8px;
      bottom: 1rem;
      color: #fff;
      min-height: 2.4rem;
      padding: 0 1.1rem;
      position: absolute;
      right: 1rem;
      z-index: 8;
    }

    .cloud {
      background: rgba(255, 255, 255, 0.56);
      border-radius: 999px;
      filter: blur(1px);
      height: 1.8rem;
      position: absolute;
      width: 7rem;
      z-index: 1;
    }

    .cloud::before,
    .cloud::after {
      background: inherit;
      border-radius: inherit;
      content: "";
      position: absolute;
    }

    .cloud::before {
      height: 2.6rem;
      left: 1rem;
      top: -1.05rem;
      width: 2.8rem;
    }

    .cloud::after {
      height: 2.1rem;
      right: 0.8rem;
      top: -0.75rem;
      width: 3.4rem;
    }

    .cloud-one {
      animation: drift 30s linear infinite;
      left: 5%;
      top: 35%;
    }

    .cloud-two {
      animation: drift 38s linear infinite;
      left: 42%;
      opacity: 0.46;
      top: 54%;
      transform: scale(0.8);
    }

    .cloud-three {
      animation: drift 45s linear infinite;
      left: 72%;
      opacity: 0.36;
      top: 48%;
      transform: scale(0.62);
    }

    .mountains {
      background:
        linear-gradient(135deg, transparent 0 42%, rgba(58, 91, 102, 0.38) 43% 61%, transparent 62%),
        linear-gradient(30deg, transparent 0 42%, rgba(53, 92, 104, 0.35) 43% 62%, transparent 63%);
      bottom: 20vh;
      height: 9vh;
      left: -5%;
      opacity: 0.9;
      position: absolute;
      right: -5%;
      z-index: 2;
    }

    .runway {
      background:
        linear-gradient(88deg, transparent 0 22%, rgba(255, 255, 255, 0.58) 23% 23.35%, transparent 24% 47%, rgba(255, 255, 255, 0.54) 48% 48.35%, transparent 49% 73%, rgba(255, 255, 255, 0.58) 74% 74.35%, transparent 75%),
        linear-gradient(176deg, rgba(255, 255, 255, 0.18), rgba(55, 54, 52, 0.08)),
        repeating-linear-gradient(174deg, rgba(61, 61, 61, 0.16) 0 0.08rem, transparent 0.1rem 1.15rem),
        #c9c9c3;
      bottom: 0;
      height: 24vh;
      left: -3%;
      position: absolute;
      right: -3%;
      transform: perspective(32rem) rotateX(58deg);
      transform-origin: bottom center;
      z-index: 1;
    }

    @keyframes hoverFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-0.35rem); }
    }

    @keyframes airWake {
      0%, 100% {
        opacity: 0;
        transform: translateY(0) scaleX(0.7);
      }

      45% {
        opacity: 0.7;
        transform: translateY(0.7rem) scaleX(1.15);
      }
    }

    @keyframes popMeter {
      0% {
        opacity: 0;
        transform: translate(-50%, 0.5rem) scale(0.88);
      }

      18% { opacity: 1; }

      100% {
        opacity: 0;
        transform: translate(-50%, -2.2rem) scale(1.08);
      }
    }

    @keyframes drift {
      from { translate: -8vw 0; }
      to { translate: 18vw 0; }
    }

    @media (max-width: 860px) {
      .topbar {
        align-items: stretch;
        flex-direction: column;
        gap: 0.85rem;
      }

      .summary-strip {
        justify-content: flex-start;
      }

      .flight-grid {
        padding-left: 0.35rem;
        padding-right: 0.35rem;
      }

      .meter {
        left: 51%;
        transform: translateX(8%);
      }

      .lane-controls {
        align-items: stretch;
        flex-direction: column;
        gap: 0.55rem;
      }

      .lift-button {
        min-width: 0;
        width: 100%;
      }
    }

    @media (max-width: 560px) {
      .flight-grid {
        gap: 0.1rem;
        padding-bottom: 7rem;
        padding-top: 9.4rem;
      }

      .mother-wrap {
        bottom: 2.2rem;
        width: clamp(4.4rem, 25vw, 6.4rem);
      }

      .meter {
        bottom: 2.1rem;
      }

      .meter-line::before,
      .meter-line::after {
        width: 1.05rem;
      }

      .meter-label {
        transform: translateX(-0.2rem);
        writing-mode: vertical-rl;
      }

      .lane-controls {
        margin: 0 0.15rem;
        padding: 0.55rem;
      }

      .pilot-name {
        font-size: 1.35rem;
      }

      .pilot-height {
        font-size: 0.76rem;
      }
    }
  </style>
</head>
<body>
  <main class="sky-stage" aria-label="鑰佹瘝浜茶捣椋為珮搴︾粺璁?>
    <div class="cloud cloud-one"></div>
    <div class="cloud cloud-two"></div>
    <div class="cloud cloud-three"></div>

    <header class="topbar">
      <div>
        <p class="eyebrow">鑰佹瘝浜茶捣椋為珮搴︾粺璁?/p>
        <h1>鑰佹瘝璧烽瑙傛祴鍙?/h1>
      </div>
      <div class="summary-strip" aria-label="缁熻姹囨€?>
        <span>鎬婚珮搴?<strong id="totalHeight">9</strong> 绫?/span>
        <span>鏈€楂?<strong id="leaderName">閭?/strong>锛?span id="leaderHeight">6</span> 绫?/span>
      </div>
    </header>

    <section class="flight-grid" id="flightGrid"></section>
    <button type="button" class="reset-button" id="resetButton">褰掗浂</button>
    <div class="mountains"></div>
    <div class="runway"></div>
  </main>

  <script>
    const pilots = [
      { id: "luo", name: "缃?, start: 1 },
      { id: "yu", name: "閮?, start: 2 },
      { id: "shao", name: "閭?, start: 6 },
    ];
    const storageKey = "laomuqifei-standalone-heights-v1";
    const initialHeights = Object.fromEntries(pilots.map((pilot) => [pilot.id, pilot.start]));
    let heights = { ...initialHeights };
    let boosts = Object.fromEntries(pilots.map((pilot) => [pilot.id, 0]));

    try {
      const saved = JSON.parse(localStorage.getItem(storageKey) || "null");
      if (saved) {
        heights = Object.fromEntries(pilots.map((pilot) => {
          const value = saved[pilot.id];
          return [pilot.id, Number.isFinite(value) ? value : pilot.start];
        }));
      }
    } catch {
      localStorage.removeItem(storageKey);
    }

    const grid = document.getElementById("flightGrid");
    const totalHeight = document.getElementById("totalHeight");
    const leaderName = document.getElementById("leaderName");
    const leaderHeight = document.getElementById("leaderHeight");

    function render() {
      localStorage.setItem(storageKey, JSON.stringify(heights));
      const leader = pilots.reduce((current, pilot) =>
        heights[pilot.id] > heights[current.id] ? pilot : current
      );

      totalHeight.textContent = pilots.reduce((sum, pilot) => sum + heights[pilot.id], 0);
      leaderName.textContent = leader.name;
      leaderHeight.textContent = heights[leader.id];
      grid.innerHTML = "";

      pilots.forEach((pilot) => {
        const height = heights[pilot.id];
        const lane = document.createElement("article");
        lane.className = "flight-lane";
        lane.style.setProperty("--meters", Math.min(height, 10));
        lane.innerHTML = `
          <div class="height-field">
            <div class="meter">
              <span class="meter-line"></span>
              <span class="meter-label">${height} 绫?/span>

            <div class="mother-wrap" aria-hidden="true">

    function lift(id) {
      heights[id] += 1;
      boosts[id] += 1;
      render();
      window.setTimeout(() => {
        boosts[id] = 0;
        const laneIndex = pilots.findIndex((pilot) => pilot.id === id);
        const boost = grid.children[laneIndex]?.querySelector(".boost");
        if (boost) boost.textContent = "";
      }, 780);
    }

    document.getElementById("resetButton").addEventListener("click", () => {
      heights = { ...initialHeights };
      boosts = Object.fromEntries(pilots.map((pilot) => [pilot.id, 0]));
      render();
    });

    render();
